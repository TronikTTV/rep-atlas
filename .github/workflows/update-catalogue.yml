name: Update Catalogue
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'sync_catalogue.py'
      - 'requirements.txt'
      - '.github/workflows/update-catalogue.yml'
  workflow_dispatch:
    inputs:
      sellers:
        description: "Seller catalogues"
        type: choice
        default: Both
        options: [Both, Husky, Taurus]
      brands:
        description: "Comma-separated brands, or ALL (slow)"
        type: string
        default: "Stone Island,Moncler,Nike,Essentials"
      pages:
        description: "Pages per selected category"
        type: choice
        default: '5'
        options: ['2','5','10','20']
      yupoo_url:
        description: "Specific Yupoo album or category URL (takes priority over brands)"
        type: string
        default: ''
      brand:
        description: "Brand name for URL imports, optional"
        type: string
        default: ''
      extra_sources:
        description: "Optional manually added linked galleries; Brand=https://foo.x.yupoo.com;Brand=https://bar.x.yupoo.com"
        type: string
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rep-atlas-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check importer syntax
        run: python -m py_compile sync_catalogue.py
      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install -r requirements.txt
      - name: Import requested brands and linked Yupoo catalogues
        if: github.event_name == 'workflow_dispatch'
        env:
          SELLERS: ${{ inputs.sellers }}
          BRANDS: ${{ inputs.brands }}
          PAGES: ${{ inputs.pages }}
          EXTRA_SOURCES: ${{ inputs.extra_sources }}
          YUPOO_URL: ${{ inputs.yupoo_url }}
          BRAND: ${{ inputs.brand }}
        run: |
          python sync_catalogue.py --sellers "$SELLERS" --brands "$BRANDS" --pages "$PAGES" --extra-sources "$EXTRA_SOURCES" --url "$YUPOO_URL" --brand "$BRAND"
      - name: Commit imported catalogue
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "rep-atlas-bot"
          git config user.email "rep-atlas-bot@users.noreply.github.com"
          git add docs/data/catalogue.json docs/images/
          if ! git diff --cached --quiet; then
            git commit -m "Update REP ATLAS catalogue"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
