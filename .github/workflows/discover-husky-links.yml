name: Discover Husky Linked Yupoos
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: husky-link-index
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Discover linked public Yupoo catalogues
        run: python discover_husky_links.py
      - name: Commit discovered verified URLs
        if: always()
        run: |
          git config user.name rep-atlas-bot
          git config user.email rep-atlas-bot@users.noreply.github.com
          git add docs/data/husky_categories.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified linked Yupoo catalogues"
            git push
          fi
